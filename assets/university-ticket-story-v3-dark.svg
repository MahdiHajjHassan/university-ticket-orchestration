<title id="universityTitle">University multi-agent ticket routing: knowledge context and a responsible owner</title>
<desc id="universityDesc">Students and staff submit a university request. An orchestrator coordinates a knowledge RAG agent and a workflow agent. Retrieved university context supports request analysis, department selection and assignment to a responsible staff member.</desc>
